<!--
  tac-os architecture diagram — Business level: actors and scenario steps in domain language. No processes, no transport.
  Maintained by hand as plain SVG; edit the text and coordinates directly.
  WHEN TO UPDATE: Update when the game scenario or domain rules change (docs/requirements.md, e.g. tag rule, team encoding).
  Keep this diagram on its own level (see docs/architecture/README.md) and keep labels in Russian:
  the diagrams are embedded in the Russian README.md.
-->

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title description">
<title id="title">От наблюдения игрока к общей карте команды</title>
<desc id="description">Кадр камеры поступает на распознавание маркера. ID игрока и положение маркера в кадре вместе с координатами и ориентацией наблюдателя используются для вычисления координат цели. Наблюдения объединяются в состояние цели и отображаются на карте команды.</desc>
<defs><marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f2a3a"/></marker></defs>
<style>
text { font-family: Helvetica, Arial, sans-serif; fill: #1f1c26; }
.box { fill: white; stroke: #2f2a3a; stroke-width: 1.5; }
.actor { fill: #f7f6fa; stroke: #625d70; stroke-width: 1.5; }
.name { font-size: 20px; font-weight: 600; }
.sub { font-size: 17px; fill: #625d70; }
.label { font-size: 16px; }
.edge { stroke: #2f2a3a; stroke-width: 1.5; fill: none; marker-end: url(#b1); }
</style>
<rect width="1200" height="1060" fill="white"/>

<rect class="actor" x="565" y="20" width="220" height="60" rx="30"/>
<text class="name" x="675.0" y="52" text-anchor="middle">
<tspan x="675.0" dy="0">Игрок</tspan>
</text>
<path class="edge" d="M675,80 L675,160"/>
<text class="label" x="695" y="108" text-anchor="start">
<tspan x="695" dy="0">Кадр камеры</tspan>
<tspan x="695" dy="24">с маркером игрока</tspan>
</text>
<rect class="box" x="430" y="160" width="490" height="105" rx="8"/>
<text class="name" x="675.0" y="192" text-anchor="middle">
<tspan x="675.0" dy="0">Распознать маркер игрока</tspan>
</text>
<text class="sub" x="675.0" y="220" text-anchor="middle">
<tspan x="675.0" dy="0">Определить ID игрока</tspan>
<tspan x="675.0" dy="24">и принадлежность к команде</tspan>
</text>
<path class="edge" d="M675,265 L675,365"/>
<text class="label" x="695" y="293" text-anchor="start">
<tspan x="695" dy="0">ID распознанного игрока</tspan>
<tspan x="695" dy="24">и положение маркера в кадре</tspan>
</text>
<rect class="box" x="430" y="365" width="490" height="125" rx="8"/>
<text class="name" x="675.0" y="397" text-anchor="middle">
<tspan x="675.0" dy="0">Вычислить координаты цели</tspan>
</text>
<text class="sub" x="675.0" y="425" text-anchor="middle">
<tspan x="675.0" dy="0">Использовать направление и расстояние до маркера,</tspan>
<tspan x="675.0" dy="24">положение и ориентацию наблюдателя</tspan>
</text>
<polygon class="actor" points="40,355 310,355 280,475 10,475"/>
<text class="name" x="160" y="383" text-anchor="middle">
<tspan x="160">Положение</tspan><tspan x="160" dy="24">наблюдателя</tspan>
</text>
<text class="sub" x="160" y="435" text-anchor="middle">
<tspan x="160">Координаты и</tspan><tspan x="160" dy="24">направление камеры</tspan>
</text>
<path class="edge" d="M292.5,425 L430,425"/>
<text class="label" x="360" y="386" text-anchor="middle">
<tspan x="360">Координаты</tspan><tspan x="360" dy="24">+ ориентация</tspan>
</text>
<text class="sub" x="160" y="505" text-anchor="middle" style="font-size:14px">
<tspan x="160">Источник: геолокация и датчики.</tspan>
<tspan x="160" dy="20">Для демо: задать значения вручную.</tspan>
</text>
<path class="edge" d="M675,490 L675,590"/>
<text class="label" x="695" y="514" text-anchor="start">
<tspan x="695" dy="0">Наблюдение: ID цели, координаты,</tspan>
<tspan x="695" dy="24">время и уверенность</tspan>
</text>
<rect class="box" x="430" y="590" width="490" height="125" rx="8"/>
<text class="name" x="675.0" y="622" text-anchor="middle">
<tspan x="675.0" dy="0">Объединить наблюдения об одной цели</tspan>
</text>
<text class="sub" x="675.0" y="650" text-anchor="middle">
<tspan x="675.0" dy="0">Уточнить координаты и вероятность</tspan>
<tspan x="675.0" dy="24">с учётом новых сообщений и их давности</tspan>
</text>
<path class="edge" d="M675,715 L675,815"/>
<text class="label" x="695" y="738" text-anchor="start">
<tspan x="695" dy="0">Состояние цели: ID, координаты,</tspan>
<tspan x="695" dy="24">вероятность и время</tspan>
<tspan x="695" dy="24">последнего наблюдения</tspan>
</text>
<rect class="box" x="430" y="815" width="490" height="105" rx="8"/>
<text class="name" x="675.0" y="847" text-anchor="middle">
<tspan x="675.0" dy="0">Отобразить состояние целей на карте</tspan>
</text>
<text class="sub" x="675.0" y="875" text-anchor="middle">
<tspan x="675.0" dy="0">Показать положение, команду, вероятность</tspan>
<tspan x="675.0" dy="24">и время последнего наблюдения</tspan>
</text>
<path class="edge" d="M675,920 L675,1000"/>
<text class="label" x="695" y="947" text-anchor="start">
<tspan x="695" dy="0">Карта с положением целей</tspan>
<tspan x="695" dy="24">и вероятностью их нахождения</tspan>
</text>
<rect class="actor" x="565" y="1000" width="220" height="50" rx="25"/>
<text class="name" x="675.0" y="1032" text-anchor="middle">
<tspan x="675.0" dy="0">Команда</tspan>
</text>
</svg>

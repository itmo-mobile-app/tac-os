  <text class="t-head" x="696" y="101">процесс: Broker</text>
  <text class="t-sub" x="698" y="146">Go или Rust</text>
  <line class="edge" x1="590" y1="130" x2="676" y2="130" marker-start="url(#a1)" marker-end="url(#a1)"/>
  <text class="t-arrow" x="633" y="118" text-anchor="middle">TCP</text>

  <rect class="proc" x="680" y="260" width="280" height="100" rx="6"/>
  <path class="proc-head" d="M680 266 a6 6 0 0 1 6 -6 h268 a6 6 0 0 1 6 6 v26 h-280 z"/>
  <text class="t-head" x="696" y="281">процесс: Target Service</text>
  <text class="t-sub" x="698" y="326">Go или Rust</text>
  <line class="edge" x1="820" y1="180" x2="820" y2="256" marker-start="url(#a1)" marker-end="url(#a1)"/>
  <text class="t-arrow" x="828" y="222">TCP</text>

  <rect class="proc" x="680" y="420" width="280" height="90" rx="6"/>
  <path class="proc-head" d="M680 426 a6 6 0 0 1 6 -6 h268 a6 6 0 0 1 6 6 v26 h-280 z"/>
  <text class="t-head" x="696" y="441">процесс: СУБД</text>

name: Window Manager Go checks

on:
  pull_request:
    paths:
      - "window-manager/**"
      - ".github/workflows/go-window-manager.yml"
  push:
    branches: [main]
    paths:
      - "window-manager/**"
      - ".github/workflows/go-window-manager.yml"

jobs:
  window-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: window-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: window-manager/go.mod
          cache: false
      - name: Vet and headless tests with race detector
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build server and client
        run: |
          go build ./cmd/wm-server
          go build ./cmd/wm-client
      - name: Build graphical backend
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          go build -tags sdl ./cmd/wm-server

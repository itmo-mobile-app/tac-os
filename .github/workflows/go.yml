name: Go

on:
  pull_request:
  push:
    branches: [main]

jobs:
  system-smoke:
    name: Linux system smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/system-smoke
    env:
      GOPROXY: "off"
      GOSUMDB: "off"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false
      - name: Use an empty module cache
        run: echo "GOMODCACHE=$(mktemp -d)" >> "$GITHUB_ENV"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Go vet
        run: go vet ./...
      - name: Test isolation, failure and cancellation (race detector)
        run: go test -race -count=1 -timeout 5m ./...
      - name: Run documented CLI
        run: go run -mod=readonly .

  modules:
    name: Go / ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Marker Detector core
            directory: prototypes/marker-detect
            packages: ./pose ./marker ./ipc ./internal/runtimehelper
          - component: Broker
            directory: broker
            packages: ./...
          - component: Window Manager
            directory: window-manager
            packages: ./...
          - component: Map
            directory: app/map
            packages: ./...
          - component: DBMS
            directory: server/dbms
            packages: ./...
          - component: Target Service
            directory: target-service
            packages: ./...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # WM had no formatting gate before this consolidation; do not impose
      # a new one on another owner's existing code as part of CI refactoring.
      - name: Check Go formatting
        if: matrix.component != 'Window Manager'
        working-directory: ${{ matrix.directory }}
        run: test -z "$(gofmt -l .)"
      - name: Go vet
        working-directory: ${{ matrix.directory }}
        run: go vet ${{ matrix.packages }}
      - name: Go tests (race detector)
        working-directory: ${{ matrix.directory }}
        run: go test -race -count=1 ${{ matrix.packages }}

      # Run the DBMS client E2E against the real server, not just the fake socket
      # responder used by ordinary unit tests.
      - name: Build DBMS server for Target Service E2E
        if: matrix.component == 'Target Service'
        working-directory: server/dbms
        run: go build -buildvcs=false -o "$RUNNER_TEMP/tacdb-server" ./cmd/tacdb-server

      - name: Test Target Service client against real DBMS
        if: matrix.component == 'Target Service'
        working-directory: target-service
        env:
          TACOS_DBMS_SERVER: ${{ runner.temp }}/tacdb-server
        run: go test -race -count=1 -v -run '^TestRealDBMSIntegration        if: matrix.component == 'Window Manager'
        working-directory: window-manager
        run: |
          go build -o "$RUNNER_TEMP/wm-server-headless" ./cmd/wm-server
          go build -o "$RUNNER_TEMP/wm-client" ./cmd/wm-client

      - name: Build Window Manager SDL2 backend
        if: matrix.component == 'Window Manager'
        working-directory: window-manager
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          go build -tags sdl -o "$RUNNER_TEMP/wm-server-sdl" ./cmd/wm-server
 ./dbclient

      - name: Build Window Manager server and client
        if: matrix.component == 'Window Manager'
        working-directory: window-manager
        run: |
          go build -o "$RUNNER_TEMP/wm-server-headless" ./cmd/wm-server
          go build -o "$RUNNER_TEMP/wm-client" ./cmd/wm-client

      - name: Build Window Manager SDL2 backend
        if: matrix.component == 'Window Manager'
        working-directory: window-manager
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          go build -tags sdl -o "$RUNNER_TEMP/wm-server-sdl" ./cmd/wm-server

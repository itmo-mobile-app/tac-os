name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: hashFiles('compiler/gradlew') != ''
        with:
          distribution: temurin
          java-version: "17"
      - name: Build compiler
        if: hashFiles('compiler/gradlew') != ''
        working-directory: compiler
        run: bash ./gradlew --no-daemon installDist
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTACOS_SANITIZE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
